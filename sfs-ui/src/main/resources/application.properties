# SFS V1 - UI module configuration
# Milestone 01 / 

spring.application.name=sfs-ui

# Active profiles.
#
# The "mock" profile supplies in-memory stand-ins for backend services that do not exist
# yet. Milestone 01 builds the UI against these, as the specification permits
# ("API contracts; can begin with mocks").
#
# When a real service arrives in a later milestone, it is registered without the "mock"
# profile and this line is changed. No UI code changes.
spring.profiles.active=${SFS_PROFILE:mock}

# File upload limits. V1 accepts modest UTF-8 text files only.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Server port is externalised so a port clash never requires a code change.
# Override without editing this file:
#   mvn spring-boot:run -Dspring-boot.run.arguments=--server.port=9090
#   java -jar sfs-ui.jar --server.port=9090
server.port=${SFS_UI_PORT:8080}

# Fail fast and loudly rather than starting in a half-configured state.
# The Milestone 01 failure rule states: "Failures must produce an explicit
# error/status; silent success is prohibited."
spring.main.banner-mode=off

# Thymeleaf: disable template caching during development so template edits are
# visible without a restart. Milestone 14 will set this per-environment.
spring.thymeleaf.cache=false

# Logging. No sensitive value may ever be logged, per the security requirements.
logging.level.root=INFO
logging.level.com.sfs=INFO
