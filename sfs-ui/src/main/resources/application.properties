# SFS V1 - UI module configuration

spring.application.name=sfs-ui

spring.profiles.active=${SFS_PROFILE:mock}

spring.servlet.multipart.max-file-size=5MB

spring.servlet.multipart.max-request-size=5MB

server.port=${SFS_UI_PORT:8080}

server.address=${SFS_UI_ADDRESS:127.0.0.1}

sfs.memory.path=${SFS_MEMORY_PATH:data/sfs-memory}

sfs.security.keys-dir=${SFS_SECURITY_KEYS_DIR:data/sfs-keys}

sfs.security.secure-dir=${SFS_SECURITY_SECURE_DIR:data/sfs-secure}

spring.main.banner-mode=off

spring.thymeleaf.cache=false

logging.level.root=INFO

logging.level.com.sfs=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [traceId=%X{traceId:-none}] %logger{24} - %msg%n
